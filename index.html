<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Moritz' Vocab-Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one narrow column like an exam sheet; the card is the only raised object; teacher's correction-red marks what still needs work */
:root{
  --paper:#F4F6FA; --sheet:#FFFFFF; --ink:#17223B; --ink-soft:#56607A; --rule:#DCE1EC;
  --blue:#2B4FCF; --blue-soft:#E6ECFC; --red:#C9362B; --red-soft:#FBE7E4; --green:#23845A; --green-soft:#E2F3EA; --amber:#B7791F; --amber-soft:#FBF0DC;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --sheet:#172036; --ink:#E7EBF5; --ink-soft:#9AA4BD; --rule:#2A3550;
  --blue:#8EA6FF; --blue-soft:#22305A; --red:#FF8A7E; --red-soft:#43211F; --green:#6FD3A2; --green-soft:#16382B; --amber:#F0C06A; --amber-soft:#3B2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1424; --sheet:#172036; --ink:#E7EBF5; --ink-soft:#9AA4BD; --rule:#2A3550;
  --blue:#8EA6FF; --blue-soft:#22305A; --red:#FF8A7E; --red-soft:#43211F; --green:#6FD3A2; --green-soft:#16382B; --amber:#F0C06A; --amber-soft:#3B2E14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;margin:0;text-wrap:balance}
h1 .arrow{color:var(--blue)}
.sub{color:var(--ink-soft);font-size:.9rem;margin:4px 0 0}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--ink-soft);font:700 .9rem var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
button{font-family:var(--body)}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.label{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 12px;font:400 .88rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:var(--r);padding:12px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-size:.98rem}.mode span{font-size:.8rem;color:var(--ink-soft)}
.mode[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.start{border:0;background:var(--blue);color:#fff;font:700 1.05rem var(--body);padding:14px;border-radius:var(--r);cursor:pointer;width:100%}
:root[data-theme="dark"] .start{color:#0E1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .start{color:#0E1424}}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--ink-soft);font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.banner{border:1px dashed var(--rule);border-radius:var(--r);padding:10px 12px;font-size:.85rem;color:var(--ink-soft)}
/* Card */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;box-shadow:0 1px 0 var(--rule),0 12px 28px -18px rgba(23,34,59,.35);padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:260px;position:relative}
.cat{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.prompt{display:flex;flex-direction:column;gap:6px}
.basic{font-family:var(--display);font-size:1.6rem;line-height:1.2;overflow-wrap:anywhere}
.basic .up{color:var(--blue);font-size:1.2rem;vertical-align:middle;margin-left:6px}
.nuance{color:var(--ink-soft);font-size:1rem}
.answer{border-top:2px dashed var(--rule);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.answer .en{font-family:var(--display);font-size:1.7rem;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.listrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.listrow select{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:12px;padding:10px 12px;font:700 .95rem var(--body)}
.imp{background:var(--sheet);border:1px dashed var(--blue);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.filebtn{position:relative;display:inline-flex;align-self:flex-start;border:0;background:var(--blue);color:#fff;font:700 .95rem var(--body);padding:10px 16px;border-radius:12px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.danger{border:1px solid var(--red);color:var(--red);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.authbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-size:.88rem;color:var(--ink-soft)}
.authbar b{color:var(--ink)}
.gap{font-style:italic;color:var(--ink);background:var(--blue-soft);border-radius:10px;padding:8px 12px;overflow-wrap:anywhere}
.answer .ex{font-style:italic;color:var(--ink-soft)}
.speak{align-self:flex-start;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer}
.reveal{border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 1rem var(--body);padding:14px;border-radius:var(--r);cursor:pointer;margin-top:auto}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.rate button{border:0;border-radius:var(--r);padding:14px 6px;font:700 .95rem var(--body);cursor:pointer}
.r0{background:var(--red-soft);color:var(--red)}.r1{background:var(--amber-soft);color:var(--amber)}.r2{background:var(--green-soft);color:var(--green)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.opt{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);text-align:left;border-radius:var(--r);padding:12px 14px;font-size:1rem;cursor:pointer;overflow-wrap:anywhere}
.opt.ok{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.opt.bad{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.next{border:0;background:var(--ink);color:var(--paper);font:700 1rem var(--body);padding:12px;border-radius:var(--r);cursor:pointer}
/* the teacher's margin mark */
.mark{position:absolute;top:14px;right:16px;font-family:var(--display);font-size:1.6rem;color:var(--red);transform:rotate(-8deg)}
.mark.good{color:var(--green)}
.progressbar{height:6px;background:var(--rule);border-radius:999px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:12px;padding:12px 10px;font-size:.92rem;cursor:pointer;text-align:left;min-height:56px;overflow-wrap:anywhere}
.pair.sel{border-color:var(--blue);background:var(--blue-soft)}
.pair.done{opacity:.35;cursor:default;border-style:dashed}
.pair.err{border-color:var(--red);background:var(--red-soft)}
.pair.en{font-family:var(--display);font-size:1rem}
/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1}
.stat span{font-size:.8rem;color:var(--ink-soft)}
.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--rule)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft)}
.legend .nosw::before{display:none}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cats{display:flex;flex-direction:column;gap:10px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:.9rem}
.catrow .mono{text-align:right;color:var(--ink-soft);font-size:.8rem}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--rule);font-size:.92rem}
.li .w{min-width:0}.li .w b{display:block;overflow-wrap:anywhere}.li .w span{color:var(--ink-soft);font-size:.82rem}
.pill{flex:none;align-self:center;font:700 .75rem var(--mono);padding:3px 8px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.pill.g{background:var(--green-soft);color:var(--green)}
.empty{color:var(--ink-soft);font-size:.9rem;padding:8px 0}
section{display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0}
@media (max-width:420px){.modes{grid-template-columns:1fr}.catrow{grid-template-columns:minmax(0,1fr) 80px 40px}.basic{font-size:1.35rem}.answer .en{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Vocab-Upgrade <span class="arrow">↗</span></h1>
      <p class="sub">Englisch-LK · C1/C2 · ohne Tippen</p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true">Lernen</button>
      <button role="tab" id="tab-stats" aria-selected="false">Fortschritt</button>
    </div>
  </header>

  <div class="authbar" id="authbar">
    <span id="authtext">Verbinde …</span>
    <button class="chip" id="loginbtn" hidden>Mit Google anmelden</button>
    <button class="speak" id="logoutbtn" hidden>Abmelden</button>
  </div>

  <main id="view-learn">
    <div id="setup" class="wrap" style="gap:18px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <p class="label" style="margin:0">Liste</p>
        <div class="listrow"><select id="listsel" aria-label="Vokabelliste"></select></div>
      </div>
      <div>
        <p class="label">Was üben?</p>
        <div class="chips" id="sets"></div>
      </div>
      <div>
        <p class="label">Wie üben?</p>
        <div class="modes" id="modes">
          <button class="mode" data-mode="cards" aria-pressed="true"><b>Karteikarte</b><span>Umdrehen, ehrlich bewerten</span></button>
          <button class="mode" data-mode="quiz" aria-pressed="false"><b>Auswahl</b><span>Aus 4 das richtige Wort</span></button>
          <button class="mode" data-mode="pairs" aria-pressed="false"><b>Paare</b><span>Englisch und Deutsch verbinden</span></button>
        </div>
      </div>
      <button class="start" id="start">10 Wörter starten</button>
      <div class="meta"><span id="setinfo"></span><span id="saveinfo"></span></div>
    </div>
    <div id="session" hidden class="wrap" style="gap:12px">
      <div class="meta"><span id="pos" class="mono"></span><button class="speak" id="quit">Beenden</button></div>
      <div class="progressbar"><i id="bar" style="width:0"></i></div>
      <div id="stage"></div>
    </div>
  </main>

  <main id="view-stats" hidden class="wrap" style="gap:24px"></main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
