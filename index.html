<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B106C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab-Upgrade">
<title>Vocab-Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,900&display=swap">
<style>
/* Juniors-Day-Bühne in der SQUIZZZzZ-Farbwelt: tiefblauer Raum, orange Licht, gläserne Karten.
   Farben aus DES-001-Farbwelt, Schrift Avenir (DES-002) mit Nunito Sans als Ersatz auf Geräten ohne Avenir. */
:root{
  --orange:#FF8E00; --orange-hi:#FFB04D;
  --blue-1:#1921B1; --blue-2:#121889; --blue-3:#0B106C; --night:#060938;
  --green:#00B25C; --green-2:#008A47; --red:#FF6B5E;
  --amber:#FFB04D;                         /* "in Arbeit" in der Statistik */
  --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.68); --ink-faint:rgba(255,255,255,.42);
  --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.11); --rule:rgba(255,255,255,.14);
  --display:"Avenir Next","Avenir","Nunito Sans",-apple-system,"Segoe UI",sans-serif;
  --body:"Avenir Next","Avenir","Nunito Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;min-height:100%;
  background:radial-gradient(120% 70% at 50% -10%, rgba(25,33,177,.95) 0%, rgba(18,24,137,.85) 35%, rgba(11,16,108,.9) 60%, var(--night) 100%) fixed,var(--night)}
body{margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.5 var(--body);background:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
button,input,select{font-family:var(--body)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- Bühne / Hero ---------- */
.stage-bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
#ribbons{position:absolute;left:0;top:0;width:100%;height:520px;opacity:.9}
.hero{max-width:720px;margin:0 auto;padding-top:max(36px,calc(env(safe-area-inset-top,0px) + 20px));padding-bottom:22px;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.emblem{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--orange-hi),var(--orange) 55%,#E07400);
  color:var(--blue-3);font:900 2.1rem/1 var(--display);
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 38px rgba(255,142,0,.65),0 0 90px rgba(255,142,0,.35)}
.eyebrow{font:600 .82rem var(--body);letter-spacing:.04em;color:var(--ink-soft);margin:6px 0 -10px}
h1{margin:0;font:900 clamp(2rem,7.5vw,2.9rem)/1.05 var(--display);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
.spaced{font:400 .78rem var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--ink-soft);margin:-6px 0 0;padding-left:.42em}
.who{display:flex;align-items:center;gap:12px;background:rgba(6,9,56,.72);border:1px solid var(--rule);border-radius:999px;padding:6px 6px 6px 18px;text-align:left;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.who small{display:block;font-size:.72rem;color:var(--ink-soft);line-height:1.1}
.who b{display:block;font:800 1rem/1.2 var(--display)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:var(--blue-3);font:900 1.05rem var(--display);flex:none;border:0;cursor:pointer}
.authline{font-size:.8rem;color:var(--ink-faint);margin:-4px 0 0}

/* ---------- Tabs wie "Tag 1 / Tag 2" ---------- */
.tabbar{position:sticky;top:0;z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));
  padding-top:env(safe-area-inset-top,0px);background:rgba(6,9,56,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-block:1px solid var(--rule)}
.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0}
.tabs button{border:0;background:transparent;color:var(--ink-soft);border-radius:12px;padding:10px 8px 8px;font:800 .98rem var(--display);cursor:pointer;position:relative}
.tabs button small{display:block;font:400 .72rem var(--body);color:var(--ink-faint)}
.tabs button[aria-selected="true"]{background:var(--glass-2);color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12%;right:12%;bottom:-8px;height:3px;border-radius:3px;background:var(--orange);box-shadow:0 0 12px var(--orange)}

/* ---------- Inhalt ---------- */
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
main.wrap,#view-learn{padding-top:22px}
#view-learn{max-width:640px;margin:0 auto}
.label{font:800 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}
.sub{color:var(--ink-soft);font-size:.92rem;margin:0}
.sub b{color:var(--ink)}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--ink-faint);font-size:.84rem}
.banner{border:1px dashed var(--rule);border-radius:var(--r);padding:12px;color:var(--ink-soft)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--glass);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .88rem var(--body);cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{background:var(--glass-2)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--blue-3);font-weight:800;box-shadow:0 0 18px rgba(255,142,0,.45)}
.chip.known{font-weight:800;padding:10px 18px}

.listrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.listrow select,#newname{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:rgba(6,9,56,.6);color:var(--ink);border-radius:14px;padding:12px 14px;font:700 .98rem var(--body)}
#newname{font-weight:400}
#newname::placeholder{color:var(--ink-faint)}
select option{background:var(--blue-3);color:#fff}

.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{border:1px solid var(--rule);background:var(--glass);color:var(--ink);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;transition:background .15s,border-color .15s}
.mode b{font:800 1rem var(--display)}.mode span{font-size:.8rem;color:var(--ink-soft)}
.mode[aria-pressed="true"]{border-color:var(--orange);background:linear-gradient(180deg,rgba(255,142,0,.18),rgba(255,142,0,.05));box-shadow:inset 0 0 0 1px var(--orange)}

.start,.next{border:0;cursor:pointer;font:900 1.02rem var(--display);border-radius:999px;transition:transform .12s,box-shadow .15s}
.start{background:var(--orange);color:var(--blue-3);padding:16px;width:100%;box-shadow:0 8px 30px -8px rgba(255,142,0,.75)}
.start:hover,.next:hover{transform:translateY(-1px)}
.start:disabled{opacity:.45;cursor:default;transform:none}
.next{background:var(--orange);color:var(--blue-3);padding:13px 22px}
.speak{align-self:flex-start;border:1px solid var(--rule);background:transparent;color:var(--ink-soft);border-radius:999px;padding:6px 14px;font:600 .84rem var(--body);cursor:pointer}
.speak:hover{color:var(--ink);border-color:var(--ink-faint)}

/* ---------- Karte im Juniors-Day-Programmstil ---------- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));border:1px solid var(--rule);border-radius:22px;
  padding:22px 20px;display:flex;flex-direction:column;gap:14px;min-height:280px;box-shadow:0 24px 60px -30px rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cat{font:800 .74rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.prompt{display:flex;flex-direction:column;gap:8px}
.basic{font:800 1.7rem/1.2 var(--display);overflow-wrap:anywhere}
.basic .up{color:var(--orange);font-size:1.25rem;margin-left:6px;text-shadow:0 0 14px rgba(255,142,0,.7)}
.nuance{color:var(--ink-soft);font-size:1rem}
.nuance b{color:var(--ink)}
.gap{font-style:italic;color:var(--ink);background:rgba(6,9,56,.55);border:1px solid var(--rule);border-left:3px solid var(--orange);border-radius:12px;padding:10px 14px;overflow-wrap:anywhere}
.answer{border-top:1px dashed var(--rule);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.answer .en{font:900 1.75rem/1.2 var(--display);color:var(--orange);overflow-wrap:anywhere}
.ex{font-style:italic;color:var(--ink-soft)}
.reveal{margin-top:auto;border:1px solid var(--ink-faint);background:transparent;color:var(--ink);font:800 1rem var(--display);padding:15px;border-radius:999px;cursor:pointer}
.reveal:hover{background:var(--glass-2)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.rate button{border:1px solid transparent;border-radius:16px;padding:14px 6px;font:800 .95rem var(--display);cursor:pointer}
.r0{background:rgba(255,107,94,.14);border-color:rgba(255,107,94,.45)!important;color:var(--red)}
.r1{background:rgba(255,176,77,.14);border-color:rgba(255,176,77,.45)!important;color:var(--amber)}
.r2{background:rgba(0,178,92,.18);border-color:rgba(0,178,92,.55)!important;color:#3BE08F}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.opt{border:1px solid var(--rule);background:rgba(6,9,56,.45);color:var(--ink);text-align:left;border-radius:14px;padding:13px 15px;font-size:1rem;cursor:pointer;overflow-wrap:anywhere;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--orange);background:rgba(255,142,0,.08)}
.opt.ok{border-color:var(--green);background:rgba(0,178,92,.2);color:#3BE08F;font-weight:800}
.opt.bad{border-color:var(--red);background:rgba(255,107,94,.14);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.mark{position:absolute;top:14px;right:18px;font:900 1.7rem var(--display);color:var(--red);transform:rotate(-8deg)}
.mark.good{color:#3BE08F;text-shadow:0 0 16px rgba(0,178,92,.8)}
.progressbar{height:6px;background:var(--glass-2);border-radius:999px;overflow:hidden}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-hi));box-shadow:0 0 12px var(--orange);transition:width .3s}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair{border:1px solid var(--rule);background:rgba(6,9,56,.45);color:var(--ink);border-radius:14px;padding:12px 10px;font-size:.92rem;cursor:pointer;text-align:left;min-height:58px;overflow-wrap:anywhere}
.pair.en{font:800 .98rem var(--display)}
.pair.sel{border-color:var(--orange);background:rgba(255,142,0,.16);box-shadow:0 0 16px rgba(255,142,0,.3)}
.pair.done{opacity:.3;cursor:default;border-style:dashed}
.pair.err{border-color:var(--red);background:rgba(255,107,94,.16)}

/* ---------- Namenswahl ---------- */
#picker{min-height:0;align-items:stretch}
#picker .cat{font-size:.8rem}

/* ---------- Fortschritt ---------- */
section{display:flex;flex-direction:column;gap:12px}
h2{font:900 1.3rem var(--display);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--glass);border:1px solid var(--rule);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font:900 2rem/1 var(--display)}
.stat span{font-size:.8rem;color:var(--ink-soft)}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--glass-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft)}
.legend .nosw::before{display:none}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cats{display:flex;flex-direction:column;gap:12px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:.92rem}
.catrow .mono{text-align:right;color:var(--ink-soft);font-size:.8rem}
.list{display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--rule);border-radius:var(--r);padding:0 14px}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:.94rem}
.li:last-child{border-bottom:0}
.li .w{min-width:0}.li .w b{display:block;overflow-wrap:anywhere}.li .w span{color:var(--ink-soft);font-size:.82rem}
.pill{flex:none;align-self:center;font:800 .76rem var(--mono);padding:4px 10px;border-radius:999px;background:rgba(255,107,94,.16);color:var(--red)}
.pill.g{background:rgba(0,178,92,.2);color:#3BE08F}
.empty{color:var(--ink-soft);font-size:.92rem;margin:0}

@media (max-width:460px){
  .modes{grid-template-columns:1fr}
  .catrow{grid-template-columns:minmax(0,1fr) 80px 44px}
  .basic{font-size:1.4rem}.answer .en{font-size:1.45rem}
  .stat b{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage-bg" aria-hidden="true"><canvas id="ribbons"></canvas></div>

<header class="hero">
  <div class="emblem" aria-hidden="true">↗</div>
  <p class="eyebrow">we upgrade your words</p>
  <h1>Vocab <em>Upgrade</em></h1>
  <p class="spaced">Englisch · Leistungskurs</p>
  <div class="who" id="authbar">
    <div><small>Dein Training</small><b id="authtext">Verbinde …</b></div>
    <button class="avatar" id="switchbtn" hidden title="Person wechseln" aria-label="Person wechseln">?</button>
  </div>
  <p class="authline" id="saveinfo"></p>
</header>

<nav class="tabbar">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-learn" aria-selected="true">Lernen<small>Karten · Auswahl · Paare</small></button>
    <button role="tab" id="tab-stats" aria-selected="false">Fortschritt<small>Was sitzt, was hakt</small></button>
  </div>
</nav>

<main id="view-learn">
  <div id="picker" hidden class="card">
    <div class="cat">Wer übt?</div>
    <div class="basic" style="font-size:1.35rem">Schön, dass du da bist.</div>
    <div class="chips" id="known"></div>
    <form id="newform" class="listrow">
      <input id="newname" maxlength="30" placeholder="Dein Vorname" autocomplete="given-name" aria-label="Dein Vorname">
      <button class="next" type="submit">Los geht's</button>
    </form>
    <p class="nuance" style="margin:0" id="pickhint">Das fragt die Seite nur einmal pro Gerät.</p>
  </div>
  <div id="setup" class="wrap" style="gap:22px">
    <div>
      <p class="label">Liste</p>
      <div class="listrow"><select id="listsel" aria-label="Vokabelliste"></select></div>
    </div>
    <div>
      <p class="label">Was üben?</p>
      <div class="chips" id="sets"></div>
    </div>
    <div>
      <p class="label">Wie üben?</p>
      <div class="modes" id="modes">
        <button class="mode" data-mode="cards" aria-pressed="true"><b>Karteikarte</b><span>Umdrehen, ehrlich bewerten</span></button>
        <button class="mode" data-mode="quiz" aria-pressed="false"><b>Auswahl</b><span>Aus 4 das richtige Wort</span></button>
        <button class="mode" data-mode="pairs" aria-pressed="false"><b>Paare</b><span>Einfach und präzise verbinden</span></button>
      </div>
    </div>
    <button class="start" id="start">10 Wörter starten</button>
    <div class="meta"><span id="setinfo"></span></div>
  </div>
  <div id="session" hidden class="wrap" style="gap:12px">
    <div class="meta"><span id="pos" class="mono"></span><button class="speak" id="quit">Beenden</button></div>
    <div class="progressbar"><i id="bar" style="width:0"></i></div>
    <div id="stage"></div>
  </div>
</main>

<main id="view-stats" hidden class="wrap" style="gap:26px"></main>

<script>
/* Lichtlinien wie auf der Juniors-Day-Seite, in SQUIZZZzZ-Orange */
(()=>{
  const c=document.getElementById("ribbons"), x=c.getContext("2d");
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w,h,dpr; function size(){dpr=Math.min(2,devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
  size(); addEventListener("resize",size);
  const lines=[...Array(7)].map((_,i)=>({a:18+i*7,f:.0016+i*.00023,p:i*1.3,y:.52+i*.035,o:.3+(i%3)*.16,wd:i%3?1.2:2}));
  function draw(t){
    x.clearRect(0,0,w,h);
    for(const l of lines){
      x.beginPath();
      for(let px=-20;px<=w+20;px+=8){
        const py=h*l.y + Math.sin(px*l.f*2.2 + l.p + t*.00025)*l.a + Math.sin(px*l.f*.9 - t*.00015 + l.p)*l.a*.8 - (px/w)*h*.18;
        px<0?x.moveTo(px,py):x.lineTo(px,py);
      }
      x.strokeStyle=`rgba(255,${150+Math.round(l.o*120)},40,${l.o})`; x.lineWidth=l.wd;
      x.shadowColor="rgba(255,142,0,.9)"; x.shadowBlur=12; x.stroke();
    }
    if(!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
